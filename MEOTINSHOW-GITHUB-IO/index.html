<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#03121c">
    <title>MÉO TIN SHOW - CỔNG NHẬN TRACK</title>
    <link rel="preconnect" href="https://script.google.com">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        @supports (height: 100dvh) {
            html, body, iframe { height: 100dvh; }
        }
        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: radial-gradient(circle at 50% 30%, #06253b 0%, #03121c 45%, #000 85%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        #loader.hide { opacity: 0; visibility: hidden; }
        #loader img {
            width: min(260px, 62vw);
            height: auto;
            filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.5));
            animation: float 2.4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .track {
            width: min(260px, 66vw);
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .bar {
            width: 0;
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(90deg, #0284c7, #38bdf8, #d1f4ff);
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.9);
            transition: width 0.35s ease;
        }
        .pct { color: #7dd3fc; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
        .tip { color: #94a3b8; font-size: 12px; min-height: 16px; text-align: center; padding: 0 24px; }
        #retry {
            display: none;
            padding: 10px 22px;
            border-radius: 24px;
            border: 1px solid #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            color: #e0f2fe;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }
    </style>
</head>

        <div class="pct" id="pct">ĐANG TẢI...</div>
        <div class="tip" id="tip"></div>
        <button id="retry" type="button" onclick="location.reload()">TẢI LẠI TRANG</button>
    </div>

    <iframe id="app" src="https://script.google.com/macros/s/AKfycbxwl8UKHGVe5l9wrNXhnY6nw6aFEwvQq35eCXiiOWUwn9ND4i6ucQ8aPI1_CeYA4ZF_/exec" allow="autoplay; clipboard-write; encrypted-media" title="Méo Tin Show"></iframe>

    <script>
        (function () {
            var p = 0, done = false, start = Date.now();
            var bar = document.getElementById('bar');
            var pct = document.getElementById('pct');
            var tip = document.getElementById('tip');
            var loader = document.getElementById('loader');

            function set(v) {
                p = v;
                bar.style.width = v + '%';
                pct.textContent = (v >= 100 ? 'SẴN SÀNG! ' : 'ĐANG TẢI... ') + Math.round(v) + '%';
            }
            set(3);

            var timer = setInterval(function () {
                if (p < 94) set(p + (94 - p) * 0.06);
                var s = (Date.now() - start) / 1000;
                if (s > 15) {
                    tip.textContent = 'Mạng đang yếu, bạn có thể bấm tải lại trang.';
                    document.getElementById('retry').style.display = 'inline-block';
                } else if (s > 6) {
                    tip.textContent = 'Mạng hơi chậm, đợi xíu nhé... 🔥';
                }
            }, 150);

            function finish() {
                if (done) return;
                done = true;
                clearInterval(timer);
                set(100);
                setTimeout(function () { loader.classList.add('hide'); }, 250);
            }

            // Trang bên trong báo "đã sẵn sàng" → tắt màn hình chờ.
            window.addEventListener('message', function (e) {
                if (e.data && e.data.mts === 'ready') finish();
            });
            document.getElementById('app').addEventListener('load', function () { setTimeout(finish, 4000); });
            setTimeout(finish, 45000);
        })();
    </script>
